<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horror Tablet Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }
        /* UI Overlays */
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8b0000;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 3rem; margin-bottom: 20px; letter-spacing: 5px; text-shadow: 0 0 10px #f00; }
        p { color: #aaa; margin-bottom: 30px; font-size: 1.2rem; }
        button {
            padding: 15px 40px;
            background: #550000;
            color: #fff;
            border: 2px solid #8b0000;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px #f00;
        }
        /* Virtueller Joystick */
        #joystickContainer {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            touch-action: none;
        }
        #joystickKnob {
            width: 50px;
            height: 50px;
            background: rgba(139, 0, 0, 0.6);
            border: 2px solid #8b0000;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px #f00;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #8b0000;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <h1>DIE DUNKELHEIT</h1>
        <p>Nutze den Joystick unten links zum Bewegen.<br>Weiche dem roten Geist aus und sammle die weißen Seelenfragmente.</p>
        <button id="startButton">STARTEN</button>
    </div>

    <div id="score">Fragmente: 0</div>
    <div id="joystickContainer">
        <div id="joystickKnob"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');
        const scoreDisplay = document.getElementById('score');
        
        // Canvas Größe anpassen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Spielvariablen
        let gameActive = false;
        let score = 0;
        let audioCtx = null;

        // Spieler (Überlebender)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 15,
            speed: 4,
            angle: 0
        };

        // Gegner (Geist)
        const ghost = {
            x: 100,
            y: 100,
            radius: 20,
            speed: 2.2,
            pulse: 0
        };

        // Zielobjekt (Seelenfragment)
        const item = {
            x: 0,
            y: 0,
            radius: 8
        };

        // Joystick Variablen
        const joystick = document.getElementById('joystickContainer');
        const knob = document.getElementById('joystickKnob');
        let joystickActive = false;
        let joystickStart = { x: 0, y: 0 };
        let joystickMove = { x: 0, y: 0 };
        let moveVector = { x: 0, y: 0 };

        // Prozedurale Audio-Effekte (Keine externen MP3s nötig)
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Hintergrund-Drohnen-Sound
            setInterval(() => {
                if (!gameActive) return;
                playDrone();
            }, 1000);
        }

        function playDrone() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(40 + Math.random() * 5, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        function playJumpscare() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        function playCollectSound() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // Platziere Item zufällig
        function spawnItem() {
            item.x = Math.random() * (canvas.width - 60) + 30;
            item.y = Math.random() * (canvas.height - 60) + 30;
        }

        // Touch-Steuerung für den Joystick
        joystick.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const rect = joystick.getBoundingClientRect();
            joystickStart = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            const touch = e.touches[0];
            
            let dx = touch.clientX - joystickStart.x;
            let dy = touch.clientY - joystickStart.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let maxRadius = 40; // Maximaler Ausschlag des Knaufs

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
                distance = maxRadius;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;

            // Berechne Bewegungs-Vektor (-1 bis 1)
            moveVector.x = dx / maxRadius;
            moveVector.y = dy / maxRadius;

            // Drehwinkel des Spielers anpassen
            if (distance > 5) {
                player.angle = Math.atan2(dy, dx);
            }
        });

        window.addEventListener('touchend', () => {
            joystickActive = false;
            knob.style.transform = 'translate(0px, 0px)';
            moveVector = { x: 0, y: 0 };
        });

        // Tastatur-Fallback für PC-Tests
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function handleKeyboardInput() {
            let kx = 0; let ky = 0;
            if (keys['ArrowUp'] || keys['w']) ky = -1;
            if (keys['ArrowDown'] || keys['s']) ky = 1;
            if (keys['ArrowLeft'] || keys['a']) kx = -1;
            if (keys['ArrowRight'] || keys['d']) kx = 1;
            
            if (kx !== 0 || ky !== 0) {
                moveVector.x = kx;
                moveVector.y = ky;
                player.angle = Math.atan2(ky, kx);
            } else if (!joystickActive) {
                moveVector.x = 0;
                moveVector.y = 0;
            }
        }

        // Start-Button Klick
        startButton.addEventListener('click', () => {
            if (!audioCtx) initAudio();
            startScreen.style.display = 'none';
            resetGame();
        });

        function resetGame() {
            score = 0;
            scoreDisplay.innerText = "Fragmente: " + score;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            ghost.x = 50;
            ghost.y = 50;
            spawnItem();
            gameActive = true;
        }

        function gameOver() {
            gameActive = false;
            playJumpscare();
            startScreen.style.display = 'flex';
